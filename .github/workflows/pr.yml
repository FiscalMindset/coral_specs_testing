name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dev dependencies (eslint, htmlhint, stylelint)
        run: npm ci
      - name: Lint (ESLint + htmlhint + stylelint)
        run: npm run lint
      - name: Run hub smoke tests
        run: npm test
