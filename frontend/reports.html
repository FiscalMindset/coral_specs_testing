<meta name="description" content="Searchable catalog of every Microsoft Graph v4 (Coral) connector test report.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark">🔬</span>
      <span class="brand__text">Coral Specs Testing</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a class="nav__link" href="index.html">Overview</a>
      <a class="nav__link is-active" href="reports.html">Reports</a>
      <a class="nav__link" href="timeline.html">Timeline</a>
      <a class="nav__link" href="findings.html">Findings</a>
      <a class="nav__link" href="guides.html">Guides</a>
      <a class="nav__link" href="about.html">About</a>
    </nav>
    <div class="topbar__actions">
      <a class="chip" href="https://github.com/FiscalMindset/coral_specs_testing" target="_blank" rel="noopener">Repo ↗</a>
      <a class="chip" href="https://fiscalmindset.github.io/coral_specs_testing/" target="_blank" rel="noopener">Pages ↗</a>
      <button id="themeToggle" class="chip chip--icon" type="button" aria-label="Toggle color theme" title="Toggle light/dark">◐</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="page-head">
    <p class="page-head__kicker">Microsoft Graph v4 connector · withcoral / coral</p>
    <h1 class="page-head__title">All reports</h1>
    <p class="page-head__sub"><span id="reportCount"></span> reports · searchable &amp; filterable</p>
  </div>

  <div class="controls">
    <label class="search">
      <span class="search__icon" aria-hidden="true">🔍</span>
      <input id="searchInput" type="search" placeholder="Search title, tags, stats, headline…" autocomplete="off">
    </label>
    <div class="controls__row">
      <label class="control">
        <span>Category</span>
        <select id="categoryFilter">
          <option value="all">All categories</option>
        </select>
      </label>
      <label class="control">
        <span>Status</span>
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="canonical">Canonical</option>
          <option value="latest">Latest</option>
          <option value="superseded">Superseded</option>
        </select>
      </label>
      <label class="control">
        <span>Sort</span>
        <select id="sortSelect">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="title">Title A–Z</option>
        </select>
      </label>
    </div>
  </div>
  <div id="reportGrid" class="report-grid"></div>
  <p id="emptyState" class="empty" hidden>No reports match your filters.</p>
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>Microsoft Graph v4 · Coral source QA</span>
    <span class="footer__links">
      <a href="https://github.com/FiscalMindset/coral_specs_testing" target="_blank" rel="noopener">GitHub</a>
      <span class="dot">·</span>
      <a href="https://fiscalmindset.github.io/coral_specs_testing/" target="_blank" rel="noopener">GitHub Pages</a>
    </span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
